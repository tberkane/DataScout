[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datascout"
version = "0.1.0"
description = "LLM-based web data collection for research dataset creation: query generation, search, grounded extraction and quality control."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Thomas Berkane" }]
requires-python = ">=3.10"
keywords = ["web data collection", "large language models", "information extraction", "public health", "datasets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "crawl4ai>=0.6",
    "htmldate>=1.9",
    "litellm>=1.60",
    "mistralai>=1.0.0,<2.0.0",
    "pandas>=2.0",
    "pydantic>=2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "hypothesis>=6.100"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
dev = ["datascout[test,docs]", "ruff>=0.6", "mypy>=1.11", "types-requests", "pandas-stubs"]

[project.urls]
Homepage = "https://github.com/tberkane/DataScout"
Documentation = "https://tberkane.github.io/DataScout/"
Source = "https://github.com/tberkane/DataScout"
Issues = "https://github.com/tberkane/DataScout/issues"
Changelog = "https://github.com/tberkane/DataScout/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datascout = ["data/*.json", "py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The prompts are kept byte-for-byte as first released, so their long lines are not wrapped.
"src/datascout/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["datascout", "web_data_collection"]
