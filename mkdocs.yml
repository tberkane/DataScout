site_name: DataScout
site_description: LLM-based web data collection for research dataset creation
site_url: https://tberkane.github.io/DataScout/
repo_url: https://github.com/tberkane/DataScout
repo_name: tberkane/DataScout
copyright: Copyright 2025-2026 Thomas Berkane. Apache License 2.0.

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - How it works: concepts.md
  - API reference: api.md

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            docstring_style: google
            filters: ["!^_"]
            heading_level: 3
